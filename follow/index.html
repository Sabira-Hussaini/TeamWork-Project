<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Follow WFE</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f7f7fb;
      margin: 0;
      padding: 40px;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    h1 {
      color: #333;
    }
    p {
      color: #555;
      line-height: 1.6;
    }
    .social-links a {
      display: inline-block;
      margin: 10px 10px 0 0;
      padding: 10px 18px;
      background: #7b3fe4;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      transition: 0.2s;
    }
    .social-links a:hover {
      background: #EE1E7E;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Follow WFE on Social Media</h1>
    <p>
      Stay connected with World Future Educators and help us amplify our mission.
      By following and sharing our content, you help us reach educators, learners,
      and communities around the world.
    </p>

    <div class="social-links">
      <a href="#" target="_blank">Facebook</a>
      <a href="#" target="_blank">X (Twitter)</a>
      <a href="#" target="_blank">LinkedIn</a>
      <a href="#" target="_blank">Instagram</a>
      <a href="#" target="_blank">TikTok</a>
    </div>
  </div>
</body>
</html>
